name: FinCommerce CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Lint Express Backend
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend CI (Node.js & Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fincommercedb_test
          POSTGRES_USER: finadmin
          POSTGRES_PASSWORD: finadminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: fincommercedb_test
          DB_USER: finadmin
          DB_PASSWORD: finadminpassword
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_cd_test_secret_key_2026
        run: |
          cd backend
          npm test --if-present

  # ---------------------------------------------------------------------------
  # Job 2: Build & Lint React Frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend CI (Vite & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite Application
        run: |
          cd frontend
          npm run build

  # ---------------------------------------------------------------------------
  # Job 3: Terraform Infrastructure Validation
  # ---------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Syntax & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Check Format & Initialize Validation
        run: |
          cd infrastructure
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Job 4: Container Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, terraform-validate]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: fincommerce-backend:latest

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: fincommerce-frontend:latest