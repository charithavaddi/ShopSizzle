<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_sen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c212a" />
      <stop offset="100%" stop-color="#0b0d10" />
    </radialGradient>
    <linearGradient id="fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c4350" />
      <stop offset="50%" stop-color="#282f3a" />
      <stop offset="100%" stop-color="#171b22" />
    </linearGradient>
    <linearGradient id="rose_acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <filter id="shadow_sen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg_sen)" />
  <circle cx="300" cy="300" r="190" fill="none" stroke="#72A7FF" stroke-width="1" opacity="0.25" stroke-dasharray="6 6"/>
  <g filter="url(#shadow_sen)">
    <!-- Fabric Headband -->
    <path d="M 195 325 C 170 170, 430 170, 405 325" fill="none" stroke="url(#fabric)" stroke-width="32" stroke-linecap="round"/>
    <path d="M 220 280 C 230 195, 370 195, 380 280" fill="none" stroke="#12161c" stroke-width="8" stroke-linecap="round"/>
    <!-- Metal adjusters -->
    <rect x="180" y="305" width="14" height="35" rx="6" fill="url(#rose_acc)" />
    <rect x="406" y="305" width="14" height="35" rx="6" fill="url(#rose_acc)" />
    <!-- Left Cup -->
    <g transform="translate(135, 305) rotate(-8 60 75)">
      <ellipse cx="60" cy="75" rx="55" ry="75" fill="#1e232c" stroke="#323b49" stroke-width="3"/>
      <ellipse cx="60" cy="75" rx="36" ry="54" fill="#0f1217" />
    </g>
    <!-- Right Cup -->
    <g transform="translate(350, 305) rotate(8 60 75)">
      <ellipse cx="60" cy="75" rx="55" ry="75" fill="#1e232c" stroke="#323b49" stroke-width="3"/>
      <ellipse cx="60" cy="75" rx="36" ry="54" fill="#0f1217" />
      <text x="60" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F3F5F7" text-anchor="middle" letter-spacing="1.5">SENNHEISER</text>
    </g>
  </g>
  <text x="300" y="520" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#929BA8" text-anchor="middle" letter-spacing="2">MOMENTUM 4 WIRELESS &bull; 60H BATTERY</text>
</svg>
