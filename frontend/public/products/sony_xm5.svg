<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0b0d10" />
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="50%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="pad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2f38" />
      <stop offset="100%" stop-color="#14171d" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72A7FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4BCB91" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="180" fill="none" stroke="url(#acc)" stroke-width="1" opacity="0.3" stroke-dasharray="4 8"/>
  <g filter="url(#shadow)">
    <!-- Headband -->
    <path d="M 200 320 C 180 180, 420 180, 400 320" fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 215 310 C 205 200, 395 200, 385 310" fill="none" stroke="#12161c" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Arm -->
    <rect x="188" y="300" width="16" height="40" rx="8" fill="url(#metal)" />
    <!-- Left Cup -->
    <g transform="translate(145, 310) rotate(-10 50 70)">
      <rect x="10" y="10" width="80" height="120" rx="40" fill="url(#pad)" stroke="#374151" stroke-width="3"/>
      <rect x="25" y="25" width="50" height="90" rx="25" fill="#0d1015" />
      <circle cx="50" cy="70" r="8" fill="#72a7ff" opacity="0.7"/>
    </g>
    <!-- Right Arm -->
    <rect x="396" y="300" width="16" height="40" rx="8" fill="url(#metal)" />
    <!-- Right Cup -->
    <g transform="translate(365, 310) rotate(10 50 70)">
      <rect x="10" y="10" width="80" height="120" rx="40" fill="url(#pad)" stroke="#374151" stroke-width="3"/>
      <rect x="25" y="25" width="50" height="90" rx="25" fill="#0d1015" />
      <text x="50" y="74" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#929BA8" text-anchor="middle" letter-spacing="1">SONY</text>
    </g>
  </g>
  <text x="300" y="520" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#929BA8" text-anchor="middle" letter-spacing="2">WH-1000XM5 &bull; NOISE CANCELLING</text>
</svg>
